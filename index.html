<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 여행 플래너</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Pretendard) -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-sky-50 to-emerald-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Top Header -->
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-compass text-lg"></i>
                </div>
                <span class="font-bold text-lg text-slate-900 tracking-tight">TripAI <span class="text-indigo-600 text-sm font-medium">플래너</span></span>
            </div>
            <div class="text-xs text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full font-medium">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 mr-1"></i> Gemini 연동 준비됨
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-xl mx-auto px-4 py-6 flex-grow">
        
        <!-- Input Form Card -->
        <div id="form-card" class="bg-white rounded-3xl shadow-xl shadow-indigo-100/60 border border-slate-100 p-6 mb-6 transition-all duration-300">
            <div class="mb-5">
                <h1 class="text-xl font-bold text-slate-900">어디로 떠나시나요?</h1>
                <p class="text-xs text-slate-500 mt-1">AI가 취향과 이동 수단에 딱 맞는 맞춤형 여행 일정을 짜드립니다.</p>
            </div>

            <form id="trip-form" class="space-y-4">
                <!-- Destination -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">여행지</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-location-dot"></i>
                        </span>
                        <input type="text" id="destination" required placeholder="예: 일본 도쿄, 제주도, 파리" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
                    </div>
                </div>

                <!-- Duration & Companions Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">여행 기간</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                <i class="fa-regular fa-calendar"></i>
                            </span>
                            <select id="duration" class="w-full pl-10 pr-8 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 appearance-none transition-all">
                                <option value="1">1박 2일 (2일)</option>
                                <option value="2" selected>2박 3일 (3일)</option>
                                <option value="3">3박 4일 (4일)</option>
                                <option value="4">4박 5일 (5일)</option>
                                <option value="7">일주일 (7일)</option>
                            </select>
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </span>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">누구와 가나요?</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                                <i class="fa-solid fa-user-group"></i>
                            </span>
                            <select id="companion" class="w-full pl-10 pr-8 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 appearance-none transition-all">
                                <option value="혼자">혼자서</option>
                                <option value="친구" selected>친구와 함께</option>
                                <option value="연인">연인과 함께</option>
                                <option value="가족">가족과 함께</option>
                            </select>
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Transportation Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">주요 이동 수단</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <i class="fa-solid fa-car-side"></i>
                        </span>
                        <select id="transportation" class="w-full pl-10 pr-8 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 appearance-none transition-all">
                            <option value="대중교통 (지하철/버스)" selected>대중교통 (지하철/버스)</option>
                            <option value="렌터카 / 자가용">렌터카 / 자가용</option>
                            <option value="택시 및 투어버스">택시 및 투어버스</option>
                            <option value="도보 중심 (뚜벅이 여행)">도보 중심 (뚜벅이 여행)</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- Interests Selection -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">관심사 (중복 선택)</label>
                    <div id="interests-container" class="flex flex-wrap gap-2">
                        <button type="button" class="interest-chip px-3.5 py-2 rounded-xl text-xs font-medium bg-indigo-50 text-indigo-600 border border-indigo-200 transition-all active" data-val="맛집투어">
                            <i class="fa-solid fa-utensils mr-1"></i> 맛집투어
                        </button>
                        <button type="button" class="interest-chip px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 transition-all" data-val="카페산책">
                            <i class="fa-solid fa-mug-hot mr-1"></i> 카페산책
                        </button>
                        <button type="button" class="interest-chip px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 transition-all" data-val="역사유적">
                            <i class="fa-solid fa-landmark mr-1"></i> 역사유적
                        </button>
                        <button type="button" class="interest-chip px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 transition-all" data-val="쇼핑">
                            <i class="fa-solid fa-bag-shopping mr-1"></i> 쇼핑
                        </button>
                        <button type="button" class="interest-chip px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 transition-all" data-val="자연힐링">
                            <i class="fa-solid fa-tree mr-1"></i> 자연힐링
                        </button>
                        <button type="button" class="interest-chip px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-50 text-slate-600 border border-slate-200 transition-all" data-val="액티비티">
                            <i class="fa-solid fa-person-hiking mr-1"></i> 액티비티
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-500/25 flex items-center justify-center space-x-2 transition-all">
                    <span>AI 맞춤 일정 생성하기</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="hidden bg-white rounded-3xl shadow-xl shadow-indigo-100/60 border border-slate-100 p-10 text-center">
            <div class="inline-block relative w-16 h-16 mb-4">
                <div class="absolute inset-0 rounded-full border-4 border-indigo-100"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-indigo-600">
                    <i class="fa-solid fa-plane text-lg animate-pulse"></i>
                </div>
            </div>
            <h3 class="font-bold text-slate-900 text-lg mb-1" id="loading-title">AI가 일정을 분석 중입니다</h3>
            <p class="text-xs text-slate-500" id="loading-desc">선택하신 목적지와 이동 수단에 맞는 최적의 동선을 구성하고 있어요...</p>
        </div>

        <!-- Results Section -->
        <div id="results-section" class="hidden space-y-6">
            <!-- Trip Header Summary Card -->
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl shadow-xl shadow-indigo-500/20 text-white p-6 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 text-white/10 text-9xl pointer-events-none">
                    <i class="fa-solid fa-earth-americas"></i>
                </div>
                <div class="relative z-10">
                    <div class="flex items-center justify-between mb-3">
                        <span id="result-badge" class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium">친구와 함께 • 맛집투어</span>
                        <button onclick="resetPlanner()" class="text-white/80 hover:text-white text-xs bg-white/10 px-2.5 py-1 rounded-full transition-all">
                            <i class="fa-solid fa-rotate-right mr-1"></i> 다시 만들기
                        </button>
                    </div>
                    <h2 id="result-destination" class="text-2xl font-bold tracking-tight mb-1">도쿄 2박 3일 여행</h2>
                    <p id="result-subtitle" class="text-indigo-100 text-xs">AI가 추천하는 알차고 여유로운 맞춤형 동선입니다.</p>
                </div>
            </div>

            <!-- Day Cards Container -->
            <div id="itinerary-container" class="space-y-4">
                <!-- JavaScript will populate day cards here -->
            </div>

            <!-- Bottom Actions -->
            <div class="flex gap-3 pt-2">
                <button onclick="copyItinerary()" class="flex-1 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-medium py-3 px-4 rounded-2xl text-sm shadow-sm flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-regular fa-copy text-indigo-600"></i>
                    <span>일정 복사하기</span>
                </button>
                <button onclick="showToast('일정이 저장되었습니다!')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-2xl text-sm shadow-md shadow-indigo-500/20 flex items-center justify-center space-x-2 transition-all">
                    <i class="fa-regular fa-bookmark"></i>
                    <span>내 여행에 저장</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white/40 mt-8">
        &copy; 2026 TripAI Planner. Powered by Gemini API (/api/plan)
    </footer>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2.5 rounded-2xl text-xs shadow-xl backdrop-blur-md transition-all duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">알림 메시지</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Interest Chip Selection State
        const chips = document.querySelectorAll('.interest-chip');
        let selectedInterests = ['맛집투어'];

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chip.classList.toggle('bg-indigo-50');
                chip.classList.toggle('text-indigo-600');
                chip.classList.toggle('border-indigo-200');
                chip.classList.toggle('bg-slate-50');
                chip.classList.toggle('text-slate-600');
                chip.classList.toggle('border-slate-200');
                chip.classList.toggle('active');

                const val = chip.getAttribute('data-val');
                if (selectedInterests.includes(val)) {
                    selectedInterests = selectedInterests.filter(item => item !== val);
                } else {
                    selectedInterests.push(val);
                }
            });
        });

        // Form Submit Handler
        document.getElementById('trip-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const destination = document.getElementById('destination').value.trim();
            const durationDays = parseInt(document.getElementById('duration').value);
            const companion = document.getElementById('companion').value;
            const transportation = document.getElementById('transportation').value;

            if (!destination) return;

            // Hide form, show loader
            document.getElementById('form-card').classList.add('hidden');
            const loader = document.getElementById('loading-state');
            loader.classList.remove('hidden');

            try {
                let itineraryData;
                try {
                    // Try calling the actual Vercel function endpoint if configured
                    const res = await fetch('/api/plan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ destination, days: durationDays, companion, interests: selectedInterests, transportation })
                    });
                    if (!res.ok) throw new Error('API not available');
                    itineraryData = await res.json();
                } catch (err) {
                    // Fallback to rich mock data generated based on user input including transportation mode
                    await new Promise(resolve => setTimeout(resolve, 1500)); // simulate network delay
                    itineraryData = generateMockItinerary(destination, durationDays, companion, selectedInterests, transportation);
                }

                renderItinerary(itineraryData);
                loader.classList.add('hidden');
                document.getElementById('results-section').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error(error);
                loader.classList.add('hidden');
                document.getElementById('form-card').classList.remove('hidden');
                showToast('일정 생성 중 오류가 발생했습니다.');
            }
        });

        // Rich Mock Itinerary Generator incorporating Transportation Mode
        function generateMockItinerary(destination, days, companion, interests, transportation) {
            const interestStr = interests.length > 0 ? interests.join(', ') : '자유 관광';
            const transportStr = transportation || '대중교통';
            const daysList = [];

            for (let i = 1; i <= days; i++) {
                let dayTitle = `Day ${i}`;
                let activities = [];

                if (i === 1) {
                    activities = [
                        { time: '10:00', title: `${destination} 도착 및 숙소 체크인`, desc: `공항 도착 후 [${transportStr}]을(를) 이용해 이동 및 짐 풀기`, icon: 'fa-plane-arrival', tag: '이동' },
                        { time: '12:30', title: '현지 추천 로컬 맛집 점심 식사', desc: `대표 향토 음식 및 ${interestStr} 관련 첫 코스`, icon: 'fa-utensils', tag: '맛집' },
                        { time: '15:00', title: '시내 중심가 및 주요 랜드마크 탐방', desc: `${transportStr}로 이동하며 주변 풍경 감상 및 산책`, icon: 'fa-camera', tag: '관광' },
                        { time: '19:00', title: '분위기 좋은 저녁 식사 및 야경 감상', desc: '탁 트인 전망과 함께하는 저녁 만찬', icon: 'fa-moon', tag: '힐링' }
                    ];
                } else if (i === days) {
                    activities = [
                        { time: '09:30', title: '여유로운 조식 및 체크아웃 준비', desc: '숙소 주변 산책 및 가벼운 아침 식사', icon: 'fa-mug-hot', tag: '휴식' },
                        { time: '11:00', title: '기념품 쇼핑 및 로컬 마켓 방문', desc: '지인 선물 및 특산품 구입하기', icon: 'fa-bag-shopping', tag: '쇼핑' },
                        { time: '14:00', title: `공항 이동 전 마지막 코스 (${transportStr})`, desc: '여행을 마무리하며 추억 정리', icon: 'fa-coffee', tag: '카페' },
                        { time: '17:00', title: '공항 이동 및 출국 수속', desc: '안전한 귀가길', icon: 'fa-plane-departure', tag: '이동' }
                    ];
                } else {
                    activities = [
                        { time: '10:00', title: `${interestStr} 집중 탐방 코스 A`, desc: `현지인들이 추천하는 감성 스팟 방문 ([${transportStr}] 이용)`, icon: 'fa-compass', tag: '체험' },
                        { time: '13:00', title: '인스타 피드용 유명 맛집 런치', desc: '비주얼과 맛을 모두 잡은 인기 식당', icon: 'fa-utensils', tag: '맛집' },
                        { time: '15:30', title: '오후 힐링 산책 및 로컬 카페 방문', desc: '여유로운 분위기 속에서 재충전', icon: 'fa-tree', tag: '휴식' },
                        { time: '19:30', title: '현지 분위기 만끽하는 저녁 파티/디너', desc: `${companion}과 함께하는 특별한 저녁 시간`, icon: 'fa-wine-glass', tag: '나이트' }
                    ];
                }

                daysList.push({ dayNumber: i, title: dayTitle, activities });
            }

            return {
                destination: destination,
                duration: `${days}박 ${days + 1}일`,
                companion: companion,
                interests: interests,
                transportation: transportStr,
                days: daysList
            };
        }

        // Render Itinerary to UI
        function renderItinerary(data) {
            document.getElementById('result-destination').textContent = `${data.destination} ${data.duration} 여행`;
            document.getElementById('result-badge').textContent = `${data.companion}과 함께 • ${data.interests.join(', ')} • ${data.transportation || '대중교통'}`;
            document.getElementById('result-subtitle').textContent = `Gemini AI가 ${data.destination}의 베스트 동선과 취향, 이동 수단(${data.transportation || '대중교통'})을 반영해 설계했습니다.`;

            const container = document.getElementById('itinerary-container');
            container.innerHTML = '';

            data.days.forEach((day, index) => {
                let activitiesHTML = '';
                day.activities.forEach(act => {
                    activitiesHTML += `
                        <div class="flex items-start space-x-3 relative pb-4 last:pb-0">
                            <div class="absolute left-3.5 top-8 bottom-0 w-0.5 bg-slate-100 last:hidden"></div>
                            <div class="bg-indigo-50 text-indigo-600 w-8 h-8 rounded-xl flex items-center justify-center shrink-0 z-10 text-xs shadow-sm">
                                <i class="fa-solid ${act.icon}"></i>
                            </div>
                            <div class="flex-grow bg-slate-50/80 border border-slate-100 rounded-2xl p-3.5 hover:bg-slate-50 transition-all">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">${act.time}</span>
                                    <span class="text-[10px] font-medium text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-100">${act.tag}</span>
                                </div>
                                <h4 class="font-bold text-sm text-slate-800">${act.title}</h4>
                                <p class="text-xs text-slate-500 mt-0.5">${act.desc}</p>
                            </div>
                        </div>
                    `;
                });

                const dayCard = document.createElement('div');
                dayCard.className = 'bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border border-slate-100 p-5';
                dayCard.innerHTML = `
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                        <div class="flex items-center space-x-2">
                            <div class="w-2 h-2 rounded-full bg-indigo-600"></div>
                            <h3 class="font-bold text-slate-900">Day ${day.dayNumber}</h3>
                        </div>
                        <span class="text-xs text-slate-400 font-medium">추천 일정</span>
                    </div>
                    <div class="space-y-3">
                        ${activitiesHTML}
                    </div>
                `;
                container.appendChild(dayCard);
            });
        }

        // Reset Planner
        function resetPlanner() {
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById('form-card').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Copy Itinerary Text
        function copyItinerary() {
            const dest = document.getElementById('result-destination').textContent;
            const textToCopy = `[TripAI 맞춤 일정]\n${dest}\n\n자세한 일정은 TripAI 웹앱에서 확인하세요!`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast('일정 요약이 클립보드에 복사되었습니다.');
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('일정 요약이 클립보드에 복사되었습니다.');
                } catch (err) {
                    showToast('복사에 실패했습니다.');
                }
                document.body.removeChild(textarea);
            }
        }

        // Toast Notification Helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
