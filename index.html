<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 맞춤 여행 플래너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter & Pretendard vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* Custom scrollbar for sleek horizontal day tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-md mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md shadow-indigo-200">
                    ✈️
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-900">TripGenie <span class="text-xs px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-full font-medium">AI</span></span>
            </div>
            <button onclick="resetApp()" class="text-xs text-slate-500 hover:text-indigo-600 font-medium px-2.5 py-1 rounded-lg hover:bg-slate-100 transition-colors">
                새로 만들기
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-16">

        <!-- Input Form Section -->
        <section id="formSection" class="transition-all duration-300">
            <div class="text-center mb-6 mt-2">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">어디로 떠나시나요?</h1>
                <p class="text-sm text-slate-500 mt-1">AI가 취향에 딱 맞는 일정을 짜드립니다.</p>
            </div>

            <form id="travelForm" onsubmit="handleGenerate(event)" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
                
                <!-- Destination -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">여행지</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">📍</span>
                        <input type="text" id="destination" required placeholder="예: 제주도, 도쿄, 파리" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
                    </div>
                </div>

                <!-- Duration -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">여행 기간</label>
                        <select id="duration" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
                            <option value="1박 2일">1박 2일</option>
                            <option value="2박 3일" selected>2박 3일</option>
                            <option value="3박 4일">3박 4일</option>
                            <option value="4박 5일">4박 5일</option>
                            <option value="5박 6일 이상">5박 6일 이상</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">누구와?</label>
                        <select id="companion" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all">
                            <option value="혼자">혼자</option>
                            <option value="친구와" selected>친구와</option>
                            <option value="연인과">연인과</option>
                            <option value="가족과">가족과</option>
                        </select>
                    </div>
                </div>

                <!-- Interests -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">관심사 (복수 선택 가능)</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="checkbox" name="interests" value="맛집탐방" checked class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:text-indigo-600 transition-all">
                                🍽️ 맛집탐방
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="interests" value="액티비티" class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:text-indigo-600 transition-all">
                                🏄‍♂️ 액티비티
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="interests" value="휴식/힐링" checked class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:text-indigo-600 transition-all">
                                🌿 힐링/휴식
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="interests" value="쇼핑" class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:text-indigo-600 transition-all">
                                🛍️ 쇼핑
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="interests" value="역사/문화" class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:text-indigo-600 transition-all">
                                🏛️ 역사/문화
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="interests" value="카페투어" checked class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-medium text-slate-600 peer-checked:bg-indigo-50 peer-checked:border-indigo-600 peer-checked:text-indigo-600 transition-all">
                                ☕ 카페투어
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                    <span>✨ 맞춤 일정 생성하기</span>
                </button>
            </form>
        </section>

        <!-- Loading State -->
        <div id="loadingSection" class="hidden py-16 text-center">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-4"></div>
            <h2 class="text-lg font-bold text-slate-800">AI가 여행 일정을 짜고 있어요...</h2>
            <p class="text-xs text-slate-500 mt-1">잠시만 기다려주세요. 최적의 코스를 구성 중입니다.</p>
        </div>

        <!-- Result Section -->
        <section id="resultSection" class="hidden space-y-4">
            
            <!-- Summary Card -->
            <div class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-indigo-600/20 rounded-full blur-2xl"></div>
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span id="resTag" class="text-xs font-medium px-2.5 py-1 bg-white/10 rounded-full backdrop-blur-md text-indigo-200">2박 3일 · 친구와</span>
                        <h2 id="resDestination" class="text-2xl font-bold mt-2 tracking-tight">제주도 여행 일정</h2>
                    </div>
                    <button onclick="editForm()" class="bg-white/10 hover:bg-white/25 text-white text-xs px-3 py-1.5 rounded-xl backdrop-blur-md transition-all font-medium">
                        수정
                    </button>
                </div>
                <div class="flex items-center space-x-4 text-xs text-indigo-200 pt-2 border-t border-white/10">
                    <span id="resInterests">#맛집탐방 #힐링 #카페투어</span>
                </div>
            </div>

            <!-- Day Tabs Container -->
            <div class="sticky top-14 bg-slate-50 pt-2 pb-2 z-20">
                <div id="dayTabs" class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                    <!-- Dynamic Day Tabs -->
                </div>
            </div>

            <!-- Day Itinerary Cards Container -->
            <div id="itineraryContent" class="space-y-4">
                <!-- Dynamic Content -->
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex space-x-3">
                <button onclick="sharePlan()" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition-all text-sm flex items-center justify-center space-x-1.5">
                    <span>🔗 일정 공유하기</span>
                </button>
                <button onclick="resetApp()" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-3 px-4 rounded-xl transition-all text-sm flex items-center justify-center space-x-1.5">
                    <span>🔄 다시 만들기</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Toast Notification (Custom alert alternative) -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/95 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-medium opacity-0 pointer-events-none transition-all duration-300 z-50 backdrop-blur-md">
        링크가 클립보드에 복사되었습니다!
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentPlanData = null;

        // Form Submit Handler
        async function handleGenerate(event) {
            event.preventDefault();

            const destination = document.getElementById('destination').value.trim();
            const duration = document.getElementById('duration').value;
            const companion = document.getElementById('companion').value;
            const interestEls = document.querySelectorAll('input[name="interests"]:checked');
            const interests = Array.from(interestEls).map(el => el.value);

            if (!destination) return;

            // Switch UI views
            document.getElementById('formSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            try {
                // Call real Vercel Serverless function /api/plan
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destination, duration, companion, interests })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '일정 생성에 실패했습니다.');
                }

                if (data.error) {
                    throw new Error(data.error);
                }

                currentPlanData = data;
                renderPlan(currentPlanData);
                
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('resultSection').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (err) {
                console.warn('API 호출 실패 또는 백엔드 미구동 상태. 목(Mock) 데이터로 대체합니다:', err.message);
                // Fallback to mock data if API is not available locally
                setTimeout(() => {
                    currentPlanData = generateMockPlan(destination, duration, companion, interests);
                    renderPlan(currentPlanData);
                    
                    document.getElementById('loadingSection').classList.add('hidden');
                    document.getElementById('resultSection').classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 1000);
            }
        }

        // Generate Mock Itinerary Data based on inputs
        function generateMockPlan(destination, duration, companion, interests) {
            let daysCount = 3;
            if (duration.includes('1박')) daysCount = 2;
            if (duration.includes('2박')) daysCount = 3;
            if (duration.includes('3박')) daysCount = 4;
            if (duration.includes('4박')) daysCount = 5;
            if (duration.includes('5박')) daysCount = 6;

            const days = [];
            for (let i = 1; i <= daysCount; i++) {
                days.push({
                    day: i,
                    title: i === 1 ? '설레는 첫째 날' : (i === daysCount ? '아쉬운 마지막 날' : `알찬 ${i}번째 날`),
                    spots: [
                        {
                            time: '10:00 AM',
                            title: `${destination} 대표 명소 탐방`,
                            category: '관광/랜드마크',
                            description: `${destination}의 분위기를 한눈에 느낄 수 있는 인기 장소 방문 및 산책`,
                            tip: '오전 시간에 방문하면 비교적 한산하게 즐길 수 있어요.'
                        },
                        {
                            time: '01:00 PM',
                            title: '현지 추천 맛집 식사',
                            category: '맛집',
                            description: `현지인과 여행객 모두에게 사랑받는 시그니처 메뉴 맛보기`,
                            tip: '대표 메뉴 사전 예약 또는 피크 타임 살짝 피해서 방문 추천!'
                        },
                        {
                            time: '03:30 PM',
                            title: '감성 오션뷰/마운틴뷰 카페',
                            category: '카페투어',
                            description: `멋진 풍경을 배경으로 시그니처 음료와 디저트 즐기기`,
                            tip: '창가 자리가 나면 바로 착석하는 것을 추천합니다.'
                        },
                        {
                            time: '07:00 PM',
                            title: '저녁 만찬 및 야경 산책',
                            category: '식사/휴식',
                            description: `여행의 피로를 녹여줄 맛있는 저녁 식사와 가벼운 야경 코스`,
                            tip: '하루를 마무리하며 사진을 정리하기 좋은 코스예요.'
                        }
                    ]
                });
            }

            return {
                destination,
                duration,
                companion,
                interests: interests.map(i => '#' + i).join(' '),
                days
            };
        }

        // Render Plan to UI
        function renderPlan(data) {
            document.getElementById('resDestination').innerText = `${data.destination} 여행 일정`;
            document.getElementById('resTag').innerText = `${data.duration} · ${data.companion}`;
            document.getElementById('resInterests').innerText = data.interests;

            const tabsContainer = document.getElementById('dayTabs');
            const contentContainer = document.getElementById('itineraryContent');

            tabsContainer.innerHTML = '';
            contentContainer.innerHTML = '';

            data.days.forEach((dayObj, index) => {
                // Render Tab button
                const tabBtn = document.createElement('button');
                tabBtn.className = `day-tab px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all ${index === 0 ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`;
                tabBtn.innerText = `Day ${dayObj.day}`;
                tabBtn.onclick = () => switchDay(dayObj.day);
                tabsContainer.appendChild(tabBtn);

                // Render Day Content Card
                const dayCard = document.createElement('div');
                dayCard.id = `day-card-${dayObj.day}`;
                dayCard.className = `space-y-3 ${index === 0 ? 'block' : 'hidden'}`;
                
                let spotsHtml = '';
                dayObj.spots.forEach((spot, sIndex) => {
                    spotsHtml += `
                        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm relative overflow-hidden">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold px-2.5 py-0.5 bg-indigo-50 text-indigo-600 rounded-full">${spot.time}</span>
                                <span class="text-[11px] text-slate-400 font-medium">${spot.category}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mb-1">${spot.title}</h3>
                            <p class="text-xs text-slate-600 leading-relaxed mb-3">${spot.description}</p>
                            <div class="bg-amber-50 border border-amber-200/60 rounded-xl p-2.5 text-[11px] text-amber-800 flex items-start space-x-1.5">
                                <span class="flex-shrink-0">💡</span>
                                <span class="font-medium">${spot.tip}</span>
                            </div>
                        </div>
                    `;
                });

                dayCard.innerHTML = `
                    <div class="flex items-center justify-between px-1">
                        <h3 class="font-bold text-slate-800 text-base">Day ${dayObj.day} <span class="text-xs font-normal text-slate-500 ml-1">(${dayObj.title})</span></h3>
                    </div>
                    ${spotsHtml}
                `;
                contentContainer.appendChild(dayCard);
            });
        }

        // Switch active Day tab
        function switchDay(dayNum) {
            const tabs = document.querySelectorAll('.day-tab');
            tabs.forEach((tab, idx) => {
                if (idx + 1 === dayNum) {
                    tab.className = 'day-tab px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-indigo-600 text-white shadow-md shadow-indigo-200';
                } else {
                    tab.className = 'day-tab px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all bg-white text-slate-600 border border-slate-200 hover:bg-slate-100';
                }
            });

            const cards = document.querySelectorAll('[id^="day-card-"]');
            cards.forEach(card => {
                if (card.id === `day-card-${dayNum}`) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // Edit Form Action
        function editForm() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset App
        function resetApp() {
            document.getElementById('travelForm').reset();
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Share Plan (Clipboard copy fallback)
        function sharePlan() {
            const dummyText = `✈️ [TripGenie AI 맞춤 일정]\n여행지: ${currentPlanData.destination} (${currentPlanData.duration})\n일정이 성공적으로 생성되었습니다!`;
            
            const textArea = document.createElement("textarea");
            textArea.value = dummyText;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('일정 요약이 클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다.');
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
